<!doctype html>
<html lang="zh" data-platform="darwin">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Superagent 预览</title>
  <link rel="stylesheet" href="/vendor/base.css">
  <link rel="stylesheet" href="/vendor/design-platform.css">
  <link rel="stylesheet" href="/vendor/gradient-shadow-text.css">
  <style>
    html, body, #root { height: 100%; margin: 0; }
    body { font-family: var(--dsw-font-family); background: var(--dsw-alias-bg-base); color: var(--dsw-alias-label-primary); -webkit-font-smoothing: antialiased; }
    .preview-bar { position: fixed; right: 16px; bottom: 16px; z-index: 50; display: flex; align-items: center; gap: 6px; padding: 6px 6px 6px 12px; border-radius: 999px; background: var(--dsw-alias-bg-layer-2); box-shadow: var(--dsw-elevation-prominent); font-size: 12px; color: var(--dsw-alias-label-tertiary); }
    .preview-bar button { height: 26px; padding: 0 10px; border: 0.5px solid var(--dsw-alias-border-l3); border-radius: 13px; background: transparent; color: var(--dsw-alias-label-secondary); font: inherit; cursor: pointer; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script src="/main.js"></script>
</body>
</html>
